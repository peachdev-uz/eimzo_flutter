plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "uz.peachdev.eimzo_flutter_example"
    compileSdk flutter.compileSdkVersion

    defaultConfig {
        applicationId "uz.peachdev.eimzo_flutter_example"
        minSdk 24
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            // Integratorlar release'ni R8 bilan yig'adi, shuning uchun example
            // ham shunday yig'iladi. 2.0.0 dagi xato — R8 SDK ekranlarini olib
            // tashlashi — aynan shu yoqilgan bo'lganda ushlanardi.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}